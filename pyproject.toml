[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-data-science-copilot"
version = "0.1.0"
description = "Local-first Personal Data Science Copilot — Week 01 deterministic tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2",
    "numpy>=1.24",
    "pyarrow>=12",
    "openpyxl>=3.1",
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "ruff>=0.6",
    "mypy>=1.8",
    "pandas-stubs>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "pyarrow",
    "pyarrow.*",
]
ignore_missing_imports = true
